# For manual mode, or a prefix + s you customized. The compact preset already
# adds the indicators to the stock prefix + s and prefix + w trees.
bind s choose-tree -Zs -F '#{?session_format,#{session_windows} tabs#{E:@agent-status-session},#{?window_format,#{window_name}#{E:@agent-status-window},#{pane_current_command}}}'

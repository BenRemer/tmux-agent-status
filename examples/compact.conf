# Manual installation: load after your theme and adjust the path if needed.
# With TPM, set these options before TPM initializes and let TPM load the plugin.
set -g @agent-status-preset 'compact'
set -g monitor-bell on
set -g bell-action any
set -g visual-bell on
set -g status-interval 5
run-shell '~/.tmux/plugins/tmux-agent-status/agent-status.tmux'

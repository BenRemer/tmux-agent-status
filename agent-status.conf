# Private detection helpers. Empty patterns disable that recognition path.
set -g @agent-status-internal-pane '#{&&:#{==:#{pane_dead},0},#{||:#{&&:#{@agent-status-internal-command-pattern},#{m/r:#{@agent-status-internal-command-pattern},#{pane_current_command}}},#{&&:#{@agent-status-internal-title-pattern},#{m/r:#{@agent-status-internal-title-pattern},#{pane_title}}}}}'

# Completion bell: whether a pane whose busy title just turned idle rings. A
# window you are viewing rings only after a turn of at least this many seconds.
set -g @agent-status-internal-now '%s'
set -g @agent-status-internal-bell-due '#{&&:#{E:@agent-status-internal-pane},#{||:#{==:#{&&:#{window_active},#{session_attached}},0},#{e|>=:#{e|-:#{T:@agent-status-internal-now},#{@agent-status-internal-title-busy}},#{@agent-status-internal-viewed-bell-seconds}}}}'

# Remote relay, outer side: an ssh pane whose title is another server's relay
# title, "agents BUSY/TOTAL !BELLS ~EPOCH" (BELLS is optional). Older than 30
# seconds means stale.
set -g @agent-status-internal-relay-pane '#{&&:#{@agent-status-internal-relay-pattern},#{&&:#{m/r:#{@agent-status-internal-relay-pattern},#{pane_current_command}},#{m/r:^agents [0-9]+/[0-9]+( ![0-9]+)? ~[0-9]+$,#{pane_title}}}}'
# The current time comes from a job tmux runs at most once a second and
# caches, not from %s: on macOS every time expansion costs about a
# millisecond, and a relay tab checks freshness dozens of times per redraw,
# enough to hit tmux's format time limit and blank the status line. The job
# has no % so that time expansion never rewrites it. Until its first result,
# a relay counts as fresh.
set -g @agent-status-internal-clock "#(awk 'BEGIN { srand(); print srand() }')"
set -g @agent-status-internal-relay-fresh '#{e|<:#{e|-:#{E:@agent-status-internal-clock},#{s/^.* ~//:pane_title}},30}'
set -g @agent-status-internal-relay-live '#{&&:#{E:@agent-status-internal-relay-pane},#{E:@agent-status-internal-relay-fresh}}'
set -g @agent-status-internal-relay-stale '#{&&:#{E:@agent-status-internal-relay-pane},#{==:#{E:@agent-status-internal-relay-fresh},0}}'
set -g @agent-status-internal-relay-busy '#{&&:#{E:@agent-status-internal-relay-live},#{e|>:#{s/[^0-9].*$//:#{s/^agents //:pane_title}},0}}'
set -g @agent-status-internal-relay-bell '#{&&:#{E:@agent-status-internal-relay-live},#{m/r: ![1-9][0-9]* ~,#{pane_title}}}'
# " BUSY/TOTAL" for each live relay pane in a window, for @agent-status-relay-count.
set -g @agent-status-internal-relay-counts '#{P:#{?#{E:@agent-status-internal-relay-live}, #{s/ .*$//:#{s/^agents //:pane_title}},}}'

# An optional adapter can report work when an agent has no dynamic title.
# Match the reporting command so stale state does not mark the next shell busy.
# A live relay pane is busy while its remote reports busy agents.
set -g @agent-status-internal-pane-busy '#{||:#{&&:#{E:@agent-status-internal-pane},#{||:#{&&:#{@agent-status-busy-command},#{==:#{@agent-status-busy-command},#{pane_current_command}}},#{&&:#{@agent-status-internal-busy-pattern},#{m/r:#{@agent-status-internal-busy-pattern},#{pane_title}}}}},#{E:@agent-status-internal-relay-busy}}'

# Remote relay, inner side: the title @agent-status-relay publishes, covering
# every session on this server. BELLS counts windows with an unread bell.
# Agents behind a live relay count too, so relays can chain.
set -g @agent-status-internal-pane-agent '#{||:#{E:@agent-status-internal-pane},#{E:@agent-status-internal-relay-live}}'
set -g @agent-status-internal-relay-total '#{n:#{S:#{W:#{P:#{?#{E:@agent-status-internal-pane-agent},x,}}}}}'
set -g @agent-status-internal-relay-title '#{?#{e|>:#{E:@agent-status-internal-relay-total},0},agents #{n:#{S:#{W:#{P:#{?#{E:@agent-status-internal-pane-busy},x,}}}}}/#{E:@agent-status-internal-relay-total} !#{n:#{S:#{W:#{?#{E:@agent-status-window-bell},x,}}}} ~%s,#{E:@agent-status-internal-relay-fallback}}'

# Public numeric flags. Traverse all panes/windows, including hidden ones.
set -g @agent-status-window-busy '#{||:#{P:#{?#{E:@agent-status-internal-pane-busy},x,}},0}'
# A live relay whose remote has unread bells counts as this window's bell.
set -g @agent-status-window-bell '#{||:#{window_bell_flag},#{||:#{P:#{?#{E:@agent-status-internal-relay-bell},x,}},0}}'
set -g @agent-status-window-stale '#{||:#{P:#{?#{E:@agent-status-internal-relay-stale},x,}},0}'
set -g @agent-status-session-busy '#{||:#{W:#{?#{E:@agent-status-window-busy},x,}},0}'
set -g @agent-status-session-stale '#{||:#{W:#{?#{E:@agent-status-window-stale},x,}},0}'
# session_bell_flag in some tmux versions only checks the first window.
set -g @agent-status-session-bell '#{||:#{W:#{?#{E:@agent-status-window-bell},x,}},0}'
set -g @agent-status-other-busy '#{||:#{S:#{?#{&&:#{!=:#{session_name},#{client_session}},#{E:@agent-status-session-busy}},x,}},0}'
set -g @agent-status-other-bell '#{||:#{S:#{?#{&&:#{!=:#{session_name},#{client_session}},#{E:@agent-status-session-bell}},x,}},0}'
set -g @agent-status-other-stale '#{||:#{S:#{?#{&&:#{!=:#{session_name},#{client_session}},#{E:@agent-status-session-stale}},x,}},0}'

# The session and window tree (prefix + s, prefix + w) for the compact preset:
# tmux's stock tree format plus the session and window indicators.
set -g @agent-status-internal-tree-format '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{E:@agent-status-window}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_grouped, (group #{session_group}: #{session_group_list}),}#{?session_attached, (attached),}#{E:@agent-status-session}}}'

# Plain window/session text inherits its surrounding style.
# A tab shows one state: bell, otherwise stale relay, otherwise running.
set -g @agent-status-window '#{?#{E:@agent-status-window-bell}, #{@agent-status-internal-bell-icon},#{?#{E:@agent-status-window-stale}, #{@agent-status-internal-stale-icon},#{?#{E:@agent-status-window-busy}, #{@agent-status-internal-running-icon}#{?#{==:#{@agent-status-internal-relay-count},on},#{E:@agent-status-internal-relay-counts},},}}}'
set -g @agent-status-session '#{?#{E:@agent-status-session-busy}, #{@agent-status-internal-running-icon},}#{?#{E:@agent-status-session-stale}, #{@agent-status-internal-stale-icon},}#{?#{E:@agent-status-session-bell}, #{@agent-status-internal-bell-icon},}'

# Corner styles are scoped to their own indicators.
set -g @agent-status-internal-running-indicator '#{?#{@agent-status-internal-running-style},#[push-default]#[#{@agent-status-internal-running-style}],} #{@agent-status-internal-running-icon} #{?#{@agent-status-internal-running-style},#[default]#[pop-default],}'
set -g @agent-status-internal-bell-indicator '#{?#{@agent-status-internal-bell-style},#[push-default]#[#{@agent-status-internal-bell-style}],} #{@agent-status-internal-bell-icon} #{?#{@agent-status-internal-bell-style},#[default]#[pop-default],}'
set -g @agent-status-internal-stale-indicator '#{?#{@agent-status-internal-stale-style},#[push-default]#[#{@agent-status-internal-stale-style}],} #{@agent-status-internal-stale-icon} #{?#{@agent-status-internal-stale-style},#[default]#[pop-default],}'
set -g @agent-status-other '#{?#{E:@agent-status-other-busy},#{E:@agent-status-internal-running-indicator},}#{?#{E:@agent-status-other-stale},#{E:@agent-status-internal-stale-indicator},}#{?#{E:@agent-status-other-bell},#{E:@agent-status-internal-bell-indicator},}'

# Dedicated tokens make preset removal precise without restoring stale snapshots.
set -g @agent-status-internal-preset-window-open '#[push-default]#{?#{E:@agent-status-window-bell},#{?#{@agent-status-internal-bell-style},#[#{@agent-status-internal-bell-style}],},#{?#{&&:#{==:#{window_active},0},#{E:@agent-status-window-stale}},#{?#{@agent-status-internal-stale-style},#[#{@agent-status-internal-stale-style}],},#{?#{&&:#{==:#{window_active},0},#{E:@agent-status-window-busy}},#{?#{@agent-status-internal-running-style},#[#{@agent-status-internal-running-style}],},}}}'
set -g @agent-status-internal-preset-window-close '#[default]#[pop-default]'
# Inline tab colors switch to the accent colors when the accent has them.
set -g @agent-status-internal-preset-bell-bg '#{&&:#{@agent-status-internal-bell-bg},#{E:@agent-status-window-bell}}'
set -g @agent-status-internal-preset-bell-fg '#{&&:#{@agent-status-internal-bell-fg},#{E:@agent-status-window-bell}}'
set -g @agent-status-internal-preset-stale-bg '#{&&:#{@agent-status-internal-stale-bg},#{&&:#{==:#{E:@agent-status-window-bell},0},#{&&:#{==:#{window_active},0},#{E:@agent-status-window-stale}}}}'
set -g @agent-status-internal-preset-stale-fg '#{&&:#{@agent-status-internal-stale-fg},#{&&:#{==:#{E:@agent-status-window-bell},0},#{&&:#{==:#{window_active},0},#{E:@agent-status-window-stale}}}}'
set -g @agent-status-internal-preset-running-bg '#{&&:#{@agent-status-internal-running-bg},#{&&:#{==:#{E:@agent-status-window-bell},0},#{&&:#{==:#{E:@agent-status-window-stale},0},#{&&:#{==:#{window_active},0},#{E:@agent-status-window-busy}}}}}'
set -g @agent-status-internal-preset-running-fg '#{&&:#{@agent-status-internal-running-fg},#{&&:#{==:#{E:@agent-status-window-bell},0},#{&&:#{==:#{E:@agent-status-window-stale},0},#{&&:#{==:#{window_active},0},#{E:@agent-status-window-busy}}}}}'
set -g @agent-status-internal-preset-window-icon '#{E:@agent-status-window}'
# Padding after the icon for tabs that have none of their own, so the accent
# extends past it. The flags pair replaces tmux's default `#{?window_flags,...}`.
set -g @agent-status-internal-preset-window-pad '#{?#{E:@agent-status-window}, ,}'
set -g @agent-status-internal-preset-window-flags '#{window_flags}'
set -g @agent-status-internal-preset-window-flags-pad '#{?#{E:@agent-status-window}, ,#{?window_flags,, }}'
set -g @agent-status-internal-preset-other '#{E:@agent-status-other}'

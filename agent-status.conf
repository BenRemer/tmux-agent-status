# Private detection helpers. Empty patterns disable that recognition path.
set -g @agent-status-internal-pane '#{&&:#{==:#{pane_dead},0},#{||:#{&&:#{@agent-status-internal-command-pattern},#{m/r:#{@agent-status-internal-command-pattern},#{pane_current_command}}},#{&&:#{@agent-status-internal-title-pattern},#{m/r:#{@agent-status-internal-title-pattern},#{pane_title}}}}}'
# An optional adapter can report work when an agent has no dynamic title.
# Match the reporting command so stale state does not mark the next shell busy.
set -g @agent-status-internal-pane-busy '#{&&:#{E:@agent-status-internal-pane},#{||:#{&&:#{@agent-status-busy-command},#{==:#{@agent-status-busy-command},#{pane_current_command}}},#{&&:#{@agent-status-internal-busy-pattern},#{m/r:#{@agent-status-internal-busy-pattern},#{pane_title}}}}}'

# Public numeric flags. Traverse all panes/windows, including hidden ones.
set -g @agent-status-window-busy '#{||:#{P:#{?#{E:@agent-status-internal-pane-busy},x,}},0}'
set -g @agent-status-window-bell '#{||:#{window_bell_flag},0}'
set -g @agent-status-session-busy '#{||:#{W:#{?#{E:@agent-status-window-busy},x,}},0}'
# session_bell_flag in some tmux versions only checks the first window.
set -g @agent-status-session-bell '#{||:#{W:#{?window_bell_flag,x,}},0}'
set -g @agent-status-other-busy '#{||:#{S:#{?#{&&:#{!=:#{session_name},#{client_session}},#{E:@agent-status-session-busy}},x,}},0}'
set -g @agent-status-other-bell '#{||:#{S:#{?#{&&:#{!=:#{session_name},#{client_session}},#{E:@agent-status-session-bell}},x,}},0}'

# Plain window/session text inherits its surrounding style.
set -g @agent-status-window '#{?#{E:@agent-status-window-bell}, #{@agent-status-internal-bell-icon},#{?#{E:@agent-status-window-busy}, #{@agent-status-internal-running-icon},}}'
set -g @agent-status-session '#{?#{E:@agent-status-session-busy}, #{@agent-status-internal-running-icon},}#{?#{E:@agent-status-session-bell}, #{@agent-status-internal-bell-icon},}'

# Corner styles are scoped to their own indicators.
set -g @agent-status-internal-running-indicator '#{?#{@agent-status-internal-running-style},#[push-default]#[#{@agent-status-internal-running-style}],} #{@agent-status-internal-running-icon} #{?#{@agent-status-internal-running-style},#[default]#[pop-default],}'
set -g @agent-status-internal-bell-indicator '#{?#{@agent-status-internal-bell-style},#[push-default]#[#{@agent-status-internal-bell-style}],} #{@agent-status-internal-bell-icon} #{?#{@agent-status-internal-bell-style},#[default]#[pop-default],}'
set -g @agent-status-other '#{?#{E:@agent-status-other-busy},#{E:@agent-status-internal-running-indicator},}#{?#{E:@agent-status-other-bell},#{E:@agent-status-internal-bell-indicator},}'

# Dedicated tokens make preset removal precise without restoring stale snapshots.
set -g @agent-status-internal-preset-window-open '#[push-default]#{?#{E:@agent-status-window-bell},#{?#{@agent-status-internal-bell-style},#[#{@agent-status-internal-bell-style}],},#{?#{&&:#{==:#{window_active},0},#{E:@agent-status-window-busy}},#{?#{@agent-status-internal-running-style},#[#{@agent-status-internal-running-style}],},}}'
set -g @agent-status-internal-preset-window-close '#[default]#[pop-default]'
# Inline tab colors switch to the accent colors when the accent has them.
set -g @agent-status-internal-preset-bell-bg '#{&&:#{@agent-status-internal-bell-bg},#{E:@agent-status-window-bell}}'
set -g @agent-status-internal-preset-bell-fg '#{&&:#{@agent-status-internal-bell-fg},#{E:@agent-status-window-bell}}'
set -g @agent-status-internal-preset-running-bg '#{&&:#{@agent-status-internal-running-bg},#{&&:#{==:#{E:@agent-status-window-bell},0},#{&&:#{==:#{window_active},0},#{E:@agent-status-window-busy}}}}'
set -g @agent-status-internal-preset-running-fg '#{&&:#{@agent-status-internal-running-fg},#{&&:#{==:#{E:@agent-status-window-bell},0},#{&&:#{==:#{window_active},0},#{E:@agent-status-window-busy}}}}'
set -g @agent-status-internal-preset-window-icon '#{E:@agent-status-window}'
set -g @agent-status-internal-preset-other '#{E:@agent-status-other}'

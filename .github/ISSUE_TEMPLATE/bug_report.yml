name: Bug report
description: Report a detection, notification, or installation problem.
body:
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, terminal, tmux -V, agent version, and plugin version.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Integration mode
      options:
        - Compact preset
        - Manual formats
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include which session/window is visible when the problem happens.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Minimal diagnostics
      description: Only relevant settings or command output. Remove private information.

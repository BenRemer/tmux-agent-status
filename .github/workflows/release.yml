name: Prepare release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  package:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and package committed source
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          python3 tools/package_release.py
      - name: Prepare a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag --draft "${flags[@]}" \
            --title "tmux-agent-status $GITHUB_REF_NAME" \
            --notes-file docs/RELEASE_NOTES.md
